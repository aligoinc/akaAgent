[mcp_servers.supabase]
command = "powershell"
args = [
  "-NoProfile",
  "-ExecutionPolicy",
  "Bypass",
  "-Command",
  "$env:SUPABASE_ACCESS_TOKEN=[Environment]::GetEnvironmentVariable('SUPABASE_ACCESS_TOKEN','User'); & npx.cmd -y @supabase/mcp-server-supabase@0.8.1 --project-ref your-project-ref --features database,docs",
]
